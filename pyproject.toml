[project]
name = "legendar"
version = "0.1.0"
description = "Aplicação desktop para transcrição, alinhamento e geração de legendas SRT."
requires-python = ">=3.10,<3.14"
dependencies = [
    "PySide6>=6.9,<7",
]

[project.optional-dependencies]
# Cada perfil runtime-* representa uma instalação completa da aplicação com
# um backend PyTorch explicitamente selecionado. Instale exatamente um perfil.
runtime-cpu = [
    "openai-whisper>=20250625",
    "yt-dlp>=2025.4.30",
    "torch>=2.8,<3",
    "torchvision>=0.23,<1",
    "torchaudio>=2.8,<3",
]
runtime-cu128 = [
    "openai-whisper>=20250625",
    "yt-dlp>=2025.4.30",
    "torch>=2.8,<3",
    "torchvision>=0.23,<1",
    "torchaudio>=2.8,<3",
]
runtime-rocm72 = [
    "openai-whisper>=20250625",
    "yt-dlp>=2025.4.30",
    "torch>=2.8,<3; sys_platform == 'linux'",
    "torchvision>=0.23,<1; sys_platform == 'linux'",
    "torchaudio>=2.8,<3; sys_platform == 'linux'",
    "pytorch-triton-rocm>=3.5.1; sys_platform == 'linux'",
    "triton-rocm>=3.6.0; sys_platform == 'linux'",
]

# Alinhamento é um recurso opcional até que a POC PT-BR/EN seja aprovada.
# Deve ser combinado com exatamente um dos perfis runtime-* acima.
alignment-whisperx = [
    "whisperx>=3.8.6,<4",
]

[dependency-groups]
test = [
    "pytest>=8,<10",
    "pytest-qt>=4.4,<5",
    "pytest-cov>=6,<8",
]
lint = [
    "ruff>=0.11,<1",
]
build = [
    "pyinstaller>=6.13,<7",
]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-rocm72"
url = "https://download.pytorch.org/whl/rocm7.2"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "runtime-cpu", marker = "sys_platform != 'darwin'" },
    { index = "pytorch-cu128", extra = "runtime-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
    { index = "pytorch-rocm72", extra = "runtime-rocm72", marker = "sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "runtime-cpu", marker = "sys_platform != 'darwin'" },
    { index = "pytorch-cu128", extra = "runtime-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
    { index = "pytorch-rocm72", extra = "runtime-rocm72", marker = "sys_platform == 'linux'" },
]
torchaudio = [
    { index = "pytorch-cpu", extra = "runtime-cpu", marker = "sys_platform != 'darwin'" },
    { index = "pytorch-cu128", extra = "runtime-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
    { index = "pytorch-rocm72", extra = "runtime-rocm72", marker = "sys_platform == 'linux'" },
]
pytorch-triton-rocm = [
    { index = "pytorch-rocm72", extra = "runtime-rocm72", marker = "sys_platform == 'linux'" },
]
triton-rocm = [
    { index = "pytorch-rocm72", extra = "runtime-rocm72", marker = "sys_platform == 'linux'" },
]

[tool.uv]
# O Legendar é um aplicativo desktop em layout flat neste estágio; uv gerencia
# o ambiente sem tentar instalar o projeto como uma biblioteca Python.
package = false
conflicts = [
    [
        { extra = "runtime-cpu" },
        { extra = "runtime-cu128" },
    ],
    [
        { extra = "runtime-cpu" },
        { extra = "runtime-rocm72" },
    ],
    [
        { extra = "runtime-cu128" },
        { extra = "runtime-rocm72" },
    ],
]
