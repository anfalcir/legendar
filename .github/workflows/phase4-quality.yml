name: Phase 4 quality

on:
  push:
    branches:
      - "phase-4/**"
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/phase4_model_benchmark.py"
      - "pyproject.toml"
      - "uv.lock"
      - "docs/FASE_4_PLANO.md"
      - "docs/HANDOFF_FASE_4.md"
      - ".github/workflows/phase4-quality.yml"
  workflow_dispatch:

concurrency:
  group: phase-4-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deterministic-quality:
    name: Python ${{ matrix.python-version }} / deterministic suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libegl1 libgl1 libxkbcommon-x11-0

      - name: Install pinned uv
        run: python -m pip install --disable-pip-version-check "uv==0.13.7"

      - name: Verify lockfile
        run: uv lock --check --no-progress

      - name: Install base, test, lint and evaluation dependencies
        run: uv sync --locked --group dev --group phase0 --no-progress

      - name: Compile maintained source, tests and scripts
        run: python -m compileall -q src/legendar tests scripts

      - name: Run complete deterministic suite
        run: uv run --locked --no-sync pytest -q --cov=legendar --cov-report=term-missing

      - name: Lint maintained architecture and tests
        run: >-
          uv run --locked --no-sync ruff check
          src/legendar
          tests/unit
          tests/integration
          tests/gui
          tests/helpers
          tests/legacy
          tests/test_architecture.py
          tests/conftest.py
          tests/__init__.py
          scripts/phase4_model_benchmark.py

      - name: Verify formatting
        run: >-
          uv run --locked --no-sync ruff format --check
          src/legendar
          tests/unit
          tests/integration
          tests/gui
          tests/helpers
          tests/legacy
          tests/test_architecture.py
          tests/conftest.py
          tests/__init__.py
          scripts/phase4_model_benchmark.py

  whisper-model-smoke:
    name: OpenAI Whisper / PT-BR and English CPU smoke
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Qt and FFmpeg runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            ffmpeg libegl1 libgl1 libxkbcommon-x11-0

      - name: Install pinned uv
        run: python -m pip install --disable-pip-version-check "uv==0.13.7"

      - name: Cache Whisper models and FLEURS samples
        uses: actions/cache@v4
        with:
          path: .cache/phase4
          key: phase4-whisper-smoke-${{ hashFiles('uv.lock') }}
          restore-keys: |
            phase4-whisper-smoke-

      - name: Install locked CPU runtime, tests and evaluation dependencies
        run: uv sync --locked --group dev --group phase0 --extra runtime-cpu --no-progress

      - name: Run runtime adapter tests
        run: uv run --locked --group dev --group phase0 --extra runtime-cpu pytest -q tests/unit/infrastructure/test_whisper_transcriber.py

      - name: Run multilingual recognition comparison
        run: |
          uv run --locked --group dev --group phase0 --extra runtime-cpu python scripts/phase4_model_benchmark.py \
            --models tiny,base,small \
            --samples-per-language 2 \
            --device cpu \
            --cache-dir .cache/phase4 \
            --output phase4-model-benchmark.json

      - name: Upload recognition benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: legendar-phase4-whisper-benchmark
          path: phase4-model-benchmark.json
          if-no-files-found: error
          retention-days: 90
