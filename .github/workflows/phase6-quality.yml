name: Phase 6 quality

on:
  push:
    branches:
      - "phase-6/**"
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - "docs/FASE_6_PLANO.md"
      - "docs/HANDOFF_FASE_6.md"
      - ".github/workflows/phase6-quality.yml"
  workflow_dispatch:

concurrency:
  group: phase-6-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deterministic-quality:
    name: Python ${{ matrix.python-version }} / deterministic suite
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libegl1 libgl1 libxkbcommon-x11-0

      - name: Install pinned uv
        run: python -m pip install --disable-pip-version-check "uv==0.13.7"

      - name: Verify lockfile
        run: uv lock --check --no-progress

      - name: Install deterministic test dependencies
        run: uv sync --locked --group dev --group phase0 --no-progress

      - name: Compile source, tests and scripts
        run: python -m compileall -q src/legendar tests scripts

      - name: Run complete deterministic suite
        run: uv run --locked --no-sync pytest -q --cov=src/legendar --cov-report=term-missing

      - name: Lint maintained architecture, tests and helpers
        run: >-
          uv run --locked --no-sync ruff check
          src/legendar
          tests/unit
          tests/integration
          tests/gui
          tests/helpers
          tests/legacy
          tests/test_architecture.py
          tests/conftest.py
          tests/__init__.py
          scripts/phase6_translation_benchmark.py
          scripts/phase6_gemini_api_smoke.py

      - name: Verify formatting
        run: >-
          uv run --locked --no-sync ruff format --check
          src/legendar
          tests/unit
          tests/integration
          tests/gui
          tests/helpers
          tests/legacy
          tests/test_architecture.py
          tests/conftest.py
          tests/__init__.py
          scripts/phase6_translation_benchmark.py
          scripts/phase6_gemini_api_smoke.py

  translation-runtime-smoke:
    name: NLLB adapter / real transformers CPU
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
      TOKENIZERS_PARALLELISM: "false"
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libegl1 libgl1 libxkbcommon-x11-0

      - name: Install pinned uv
        run: python -m pip install --disable-pip-version-check "uv==0.13.7"

      - name: Install locked CPU runtime
        run: uv sync --locked --group dev --group phase0 --extra runtime-cpu --no-progress

      - name: Confirm the translation dependencies resolve
        run: |
          uv run --locked --group dev --group phase0 --extra runtime-cpu python -c \
            "import sentencepiece, transformers; print(transformers.__version__)"

      - name: Run translation adapter and publication tests with the real runtime
        run: |
          uv run --locked --group dev --group phase0 --extra runtime-cpu pytest -q \
            tests/unit/infrastructure/test_nllb_translator.py \
            tests/unit/application/test_translation.py \
            tests/integration/test_translation_publication.py \
            tests/integration/test_srt_publication.py \
            tests/test_architecture.py


  gemini-api-smoke:
    name: Optional live Gemini Developer API smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PYTHONPATH: src
    steps:
      - name: Skip when no API secret is configured
        if: ${{ env.GEMINI_API_KEY == '' }}
        run: echo "GEMINI_API_KEY ausente; smoke real ignorado. Os contratos seguem cobertos por testes com dublês."

      - name: Check out repository
        if: ${{ env.GEMINI_API_KEY != '' }}
        uses: actions/checkout@v4

      - name: Set up Python
        if: ${{ env.GEMINI_API_KEY != '' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned uv
        if: ${{ env.GEMINI_API_KEY != '' }}
        run: python -m pip install --disable-pip-version-check "uv==0.13.7"

      - name: Install deterministic dependencies
        if: ${{ env.GEMINI_API_KEY != '' }}
        run: uv sync --locked --group dev --group phase0 --no-progress

      - name: Call Gemini API with a two-cue smoke sample
        if: ${{ env.GEMINI_API_KEY != '' }}
        run: uv run --locked --no-sync python scripts/phase6_gemini_api_smoke.py
