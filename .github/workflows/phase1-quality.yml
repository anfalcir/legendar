name: Phase 1 quality

on:
  push:
    branches:
      - "phase-1/**"
  pull_request:
    branches:
      - main
      - "phase-1/**"
    paths:
      - "src/**"
      - "tests/**"
      - "core/**"
      - "gui/**"
      - "main.py"
      - "pyproject.toml"
      - "uv.lock"
      - "docs/FASE_1_PLANO.md"
      - "docs/ESTADO_ATUAL.md"
      - "docs/HANDOFF_FASE_1.md"
      - "docs/LEGACY_BASELINE.md"
      - ".github/workflows/phase1-quality.yml"
  workflow_dispatch:

concurrency:
  group: phase-1-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Python ${{ matrix.python-version }} / Ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pinned uv
        run: python -m pip install --disable-pip-version-check "uv==0.13.7"

      - name: Verify lockfile
        run: uv lock --check --no-progress

      - name: Install base, test, lint and Phase 0 test dependencies
        run: uv sync --locked --group dev --group phase0 --no-progress

      - name: Compile the new architecture and legacy characterization tests
        run: python -m compileall -q src/legendar tests/legacy

      - name: Run the complete test suite, including Qt offscreen tests
        run: uv run --locked --no-sync pytest -q --cov=legendar --cov-report=term-missing

      - name: Lint the maintained architecture and test scope
        run: >-
          uv run --locked --no-sync ruff check
          src/legendar
          tests/unit
          tests/integration
          tests/gui
          tests/helpers
          tests/legacy
          tests/test_architecture.py
          tests/conftest.py
          tests/__init__.py

      - name: Verify formatting in the maintained architecture and test scope
        run: >-
          uv run --locked --no-sync ruff format --check
          src/legendar
          tests/unit
          tests/integration
          tests/gui
          tests/helpers
          tests/legacy
          tests/test_architecture.py
          tests/conftest.py
          tests/__init__.py
