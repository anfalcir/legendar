name: Phase 3 quality

on:
  push:
    branches:
      - "phase-3/**"
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - "docs/FASE_3_PLANO.md"
      - ".github/workflows/phase3-quality.yml"
  workflow_dispatch:

concurrency:
  group: phase-3-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  media-quality:
    name: Python ${{ matrix.python-version }} / Ubuntu + FFmpeg
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Qt and FFmpeg runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            ffmpeg libegl1 libgl1 libxkbcommon-x11-0

      - name: Install pinned uv
        run: python -m pip install --disable-pip-version-check "uv==0.13.7"

      - name: Verify lockfile
        run: uv lock --check --no-progress

      - name: Install base, tests, lint and Phase 0 evidence dependencies
        run: uv sync --locked --group dev --group phase0 --no-progress

      - name: Compile application and test sources
        run: python -m compileall -q src/legendar tests

      - name: Run complete suite with real FFmpeg integration fixtures
        run: uv run --locked --no-sync pytest -q --cov=src/legendar --cov-report=term-missing

      - name: Lint maintained architecture and tests
        run: >-
          uv run --locked --no-sync ruff check
          src/legendar
          tests/unit
          tests/integration
          tests/gui
          tests/helpers
          tests/legacy
          tests/test_architecture.py
          tests/conftest.py
          tests/__init__.py

      - name: Verify formatting
        run: >-
          uv run --locked --no-sync ruff format --check
          src/legendar
          tests/unit
          tests/integration
          tests/gui
          tests/helpers
          tests/legacy
          tests/test_architecture.py
          tests/conftest.py
          tests/__init__.py

      - name: Verify FFmpeg and ffprobe executables
        run: |
          ffmpeg -version
          ffprobe -version
