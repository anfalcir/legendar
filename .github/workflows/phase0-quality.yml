name: Phase 0 quality

on:
  push:
    branches:
      - phase-0/**
  pull_request:
    branches:
      - main
    paths:
      - "scripts/**"
      - "tests/**"
      - "pyproject.toml"
      - "docs/FASE_0_PROTOCOLO.md"
      - "docs/MATRIZ_DEPENDENCIAS.md"
      - ".github/workflows/phase0-quality.yml"

permissions:
  contents: read

jobs:
  dependency-resolution:
    name: Lock and resolve complete runtime profiles
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || github.head_ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned uv resolver
        run: python -m pip install --disable-pip-version-check "uv==0.13.7"

      - name: Resolve manifest on branch pushes
        if: github.event_name == 'push'
        run: uv lock --python-preference system --no-progress

      - name: Require committed lockfile on pull requests
        if: github.event_name == 'pull_request'
        run: |
          test -f uv.lock || {
            echo "::error::uv.lock is missing. The branch push must generate and commit the lockfile."
            exit 1
          }
          uv lock --check --no-progress

      - name: Verify CPU profile resolution without installing packages
        run: uv sync --locked --no-dev --extra runtime-cpu --dry-run --no-progress

      - name: Verify CUDA 12.8 profile resolution without installing packages
        run: uv sync --locked --no-dev --extra runtime-cu128 --dry-run --no-progress

      - name: Commit updated universal lockfile on branch pushes
        if: github.event_name == 'push'
        run: |
          if ! git ls-files --error-unmatch uv.lock >/dev/null 2>&1 || ! git diff --quiet -- uv.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add uv.lock
            git commit -m "build(deps): update universal dependency lock"
            git push
          else
            echo "uv.lock is already current."
          fi

      - name: Upload lockfile evidence
        uses: actions/upload-artifact@v4
        with:
          name: legendar-uv-lock-evidence
          path: uv.lock
          if-no-files-found: error
          retention-days: 7

  deterministic-checks:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile Python sources
        run: python -m compileall -q scripts tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate inventory command-line interface
        run: python scripts/phase0_inventory.py --help

      - name: Validate media POC command-line interface
        run: python scripts/phase0_media_poc.py --help

      - name: Smoke-test inventory JSON
        run: |
          python scripts/phase0_inventory.py --output "$RUNNER_TEMP/legendar-inventory.json"
          python -c "import json, pathlib; json.loads(pathlib.Path('$RUNNER_TEMP/legendar-inventory.json').read_text())"

  media-timeline-poc:
    name: FFmpeg normalization and offset preservation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FFmpeg and ffprobe
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg

      - name: Run media timeline proof of concept
        run: python scripts/phase0_media_poc.py --self-test
