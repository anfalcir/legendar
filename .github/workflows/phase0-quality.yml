name: Phase 0 quality

on:
  push:
    branches:
      - phase-0/**
  pull_request:
    branches:
      - main
    paths:
      - "scripts/**"
      - "tests/**"
      - "pyproject.toml"
      - "docs/FASE_0_PROTOCOLO.md"
      - "docs/MATRIZ_DEPENDENCIAS.md"
      - ".github/workflows/phase0-quality.yml"

permissions:
  contents: read

jobs:
  dependency-resolution:
    name: Resolve declared Python dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned uv resolver
        run: python -m pip install --disable-pip-version-check "uv==0.11.6"

      - name: Resolve manifest across declared environments
        run: uv lock --python-preference system --no-progress

      - name: Upload lockfile candidate
        uses: actions/upload-artifact@v4
        with:
          name: legendar-uv-lock-candidate
          path: uv.lock
          if-no-files-found: error
          retention-days: 2

  deterministic-checks:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile Python sources
        run: python -m compileall -q scripts tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate command-line interface
        run: python scripts/phase0_inventory.py --help

      - name: Smoke-test inventory JSON
        run: |
          python scripts/phase0_inventory.py --output "$RUNNER_TEMP/legendar-inventory.json"
          python -c "import json, pathlib; json.loads(pathlib.Path('$RUNNER_TEMP/legendar-inventory.json').read_text())"
